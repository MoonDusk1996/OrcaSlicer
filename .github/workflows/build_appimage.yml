name: Build AppImage Only

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            libgtk-3-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpng-dev \
            fakeroot \
            appstream \
            file \
            wget

      - name: Compilar e Gerar AppImage
        run: |
          chmod +x ./build_linux.sh
          ./build_linux.sh -r

      - name: Organizar Artefatos
        run: |
          mkdir -p dist
          find . -maxdepth 3 -name "*.AppImage" -exec cp {} dist/ \;
          ls -la dist/

      - name: Disponibilizar AppImage nos Artefatos da Action
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Anexar AppImage à Release do GitHub
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
